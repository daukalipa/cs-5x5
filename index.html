<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сбор 5 на 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #0e1114; --panel: #161b20; --line: #262e36; --fg: #e6e9ec; --muted: #8a949e;
  --a: #4fa3ff; --a-soft: rgba(79,163,255,.12);
  --b: #f2a33a; --b-soft: rgba(242,163,58,.12);
  --danger: #ff6b6b; --ok: #7ee08a;
  --f-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-size: 30px; letter-spacing: .02em; margin: 0; }
h1 span { color: var(--muted); font-weight: 500; }
.status { font-size: 13px; color: var(--muted); min-height: 1em; }
.status.warn { color: var(--b); }
.status.ok { color: var(--ok); }
.add { display: flex; gap: 8px; }
.add input {
  flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--fg);
  font: inherit; padding: 12px 14px; border-radius: 6px;
}
.add input:focus-visible, button:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
button {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); padding: 10px 14px;
}
button:hover { border-color: var(--muted); }
button:disabled { opacity: .35; cursor: not-allowed; }
.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.share { background: var(--a); color: #06121f; border-color: var(--a); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.danger { color: var(--danger); }
.label { font-family: var(--f-display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.pool { background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
ul { list-style: none; margin: 0; padding: 0; }
.pool ul { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 4px 4px 10px; cursor: grab; user-select: none; min-width: 0;
}
.chip .name { font-weight: 500; overflow-wrap: anywhere; }
.chip .btns { display: flex; flex-shrink: 0; }
.chip button { padding: 4px 8px; font-size: 13px; border-color: transparent; background: transparent; }
.chip .toA { color: var(--a); }
.chip .toB { color: var(--b); }
.chip .del { color: var(--muted); }
.chip .del:hover { color: var(--danger); }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: start; }
.vs { font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--muted); align-self: center; }
.team { border-radius: 8px; padding: 14px; display: grid; gap: 10px; border: 1px solid var(--line); min-width: 0; }
.team.A { background: var(--a-soft); border-top: 3px solid var(--a); }
.team.B { background: var(--b-soft); border-top: 3px solid var(--b); }
.team h2 { font-family: var(--f-display); font-size: 22px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
.team.A h2 { color: var(--a); }
.team.B h2 { color: var(--b); }
.count { font-size: 15px; font-variant-numeric: tabular-nums; color: var(--fg); }
.count.full { color: var(--ok); }
.slots { display: grid; gap: 6px; }
.slot { min-height: 42px; border-radius: 6px; display: flex; align-items: center; }
.slot.empty { border: 1px dashed var(--line); color: var(--muted); font-size: 13px; padding: 0 12px; }
.slot .chip { width: 100%; justify-content: space-between; }
.drop-over { outline: 2px solid var(--fg); outline-offset: 2px; }
.empty-note { color: var(--muted); font-size: 14px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
@media (max-width: 620px) {
  .teams { grid-template-columns: 1fr; }
  .vs { justify-self: center; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Сбор <span>5 на 5</span></h1>
    <div id="status" class="status"></div>
  </header>

  <form id="addForm" class="add" autocomplete="off">
    <input id="nameInput" maxlength="24" placeholder="Ник игрока" aria-label="Ник игрока">
    <button class="primary" type="submit">Добавить</button>
  </form>

  <section class="pool" data-team="pool">
    <div class="label"><span>Без команды</span><span id="poolCount"></span></div>
    <ul id="poolList"></ul>
  </section>

  <div class="toolbar">
    <button id="shareBtn" type="button" class="share">🔗 Поделиться составом</button>
    <button id="randomBtn" type="button">🎲 Рандом 5 на 5</button>
    <button id="resetBtn" type="button">Вернуть всех в список</button>
    <button id="clearBtn" type="button" class="danger">Удалить всех</button>
    <div id="confirmBox" class="confirm" hidden>
      <span>Точно удалить всех?</span>
      <button id="confirmYes" type="button" class="danger">Да, удалить</button>
      <button id="confirmNo" type="button">Отмена</button>
    </div>
  </div>

  <div class="teams">
    <section class="team A" data-team="A">
      <h2>Команда A <span class="count" id="countA">0/5</span></h2>
      <ul class="slots" id="slotsA"></ul>
    </section>
    <div class="vs">VS</div>
    <section class="team B" data-team="B">
      <h2>Команда B <span class="count" id="countB">0/5</span></h2>
      <ul class="slots" id="slotsB"></ul>
    </section>
  </div>

  <p class="hint">Состав сохраняется в твоём браузере. Чтобы друзья увидели те же команды, нажми «Поделиться составом» и скинь ссылку в чат.</p>
</div>

<script>
const MAX = 5;
const KEY = "cs5x5";
let players = []; // {id, name, team}
let seq = 0;
const $ = id => document.getElementById(id);

function setStatus(text, kind) {
  const s = $("status"); s.textContent = text;
  s.className = "status" + (kind ? " " + kind : "");
}

// ---------- state <-> link ----------
function encode() {
  const compact = players.map(p => [p.name, p.team === "pool" ? 0 : p.team === "A" ? 1 : 2]);
  const bytes = new TextEncoder().encode(JSON.stringify(compact));
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decode(str) {
  const b64 = str.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const arr = JSON.parse(new TextDecoder().decode(bytes));
  if (!Array.isArray(arr)) throw new Error("bad");
  const out = [];
  for (const it of arr.slice(0, 60)) {
    if (!Array.isArray(it) || typeof it[0] !== "string") continue;
    const name = it[0].trim().slice(0, 24); if (!name) continue;
    out.push({ id: "p" + (seq++), name, team: it[1] === 1 ? "A" : it[1] === 2 ? "B" : "pool" });
  }
  // enforce max 5 per team
  for (const t of ["A", "B"]) out.filter(p => p.team === t).slice(MAX).forEach(p => p.team = "pool");
  return out;
}
function shareUrl() {
  return location.origin + location.pathname + (players.length ? "#s=" + encode() : "");
}
function save() {
  try { localStorage.setItem(KEY, encode()); } catch (e) {}
  try { history.replaceState(null, "", shareUrl()); } catch (e) {}
}
function load() {
  const m = location.hash.match(/^#s=([A-Za-z0-9_-]+)$/);
  if (m) { try { players = decode(m[1]); setStatus("Открыт состав из ссылки", "ok"); return; } catch (e) { setStatus("Ссылка повреждена — открыт сохранённый состав", "warn"); } }
  try { const s = localStorage.getItem(KEY); if (s) players = decode(s); } catch (e) {}
}

// ---------- render ----------
const teamOf = t => players.filter(p => p.team === t);

function chip(p) {
  const li = document.createElement("li");
  li.className = "chip"; li.draggable = true;
  const name = document.createElement("span"); name.className = "name"; name.textContent = p.name;
  const btns = document.createElement("span"); btns.className = "btns";
  const mk = (cls, txt, title, fn, dis) => {
    const b = document.createElement("button"); b.type = "button"; b.className = cls;
    b.textContent = txt; b.title = title; b.setAttribute("aria-label", title + ": " + p.name);
    b.disabled = !!dis; b.onclick = fn; btns.appendChild(b);
  };
  if (p.team !== "A") mk("toA", "→ A", "В команду A", () => move(p.id, "A"), teamOf("A").length >= MAX);
  if (p.team !== "B") mk("toB", "→ B", "В команду B", () => move(p.id, "B"), teamOf("B").length >= MAX);
  if (p.team !== "pool") mk("back", "↩", "Убрать из команды", () => move(p.id, "pool"));
  mk("del", "✕", "Удалить", () => remove(p.id));
  li.append(name, btns);
  li.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", p.id));
  return li;
}

function render() {
  const pool = teamOf("pool"), pl = $("poolList");
  pl.replaceChildren();
  if (!pool.length) {
    const n = document.createElement("li"); n.className = "empty-note";
    n.textContent = players.length ? "Все распределены." : "Пока никого. Впиши ник выше и нажми «Добавить».";
    pl.appendChild(n);
  } else pool.forEach(p => pl.appendChild(chip(p)));
  $("poolCount").textContent = pool.length ? pool.length + " чел." : "";

  for (const t of ["A", "B"]) {
    const list = teamOf(t), ul = $("slots" + t);
    ul.replaceChildren();
    for (let i = 0; i < MAX; i++) {
      const slot = document.createElement("li");
      if (list[i]) { slot.className = "slot"; slot.appendChild(chip(list[i])); }
      else { slot.className = "slot empty"; slot.textContent = "Свободно"; }
      ul.appendChild(slot);
    }
    const c = $("count" + t);
    c.textContent = list.length + "/" + MAX;
    c.classList.toggle("full", list.length >= MAX);
  }
  $("randomBtn").disabled = players.length < 2;
  $("shareBtn").disabled = !players.length;
}

function commit() { save(); render(); }

// ---------- actions ----------
function add(raw) {
  const name = raw.trim().slice(0, 24);
  if (!name) return;
  if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) { setStatus("«" + name + "» уже в списке", "warn"); return; }
  if (players.length >= 60) { setStatus("Слишком много игроков", "warn"); return; }
  players.push({ id: "p" + (seq++), name, team: "pool" });
  setStatus(""); commit();
}
function move(id, team) {
  const i = players.findIndex(p => p.id === id); if (i < 0 || players[i].team === team) return;
  if (team !== "pool" && teamOf(team).length >= MAX) { setStatus("В команде " + team + " уже 5 игроков", "warn"); return; }
  const [p] = players.splice(i, 1); p.team = team; players.push(p); // goes to the bottom of its new list
  setStatus(""); commit();
}
function remove(id) { players = players.filter(p => p.id !== id); commit(); }
function randomize() {
  const all = players.slice();
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  const n = Math.min(all.length, MAX * 2), half = Math.ceil(n / 2);
  all.forEach((p, i) => p.team = i < half ? "A" : i < n ? "B" : "pool");
  players = all; setStatus("Команды раскиданы случайно", "ok"); commit();
}

async function share() {
  const url = shareUrl();
  try { await navigator.clipboard.writeText(url); setStatus("Ссылка скопирована — кидай в чат", "ok"); }
  catch (e) { window.prompt("Скопируй ссылку:", url); }
}

// ---------- wiring ----------
$("addForm").addEventListener("submit", e => {
  e.preventDefault(); const inp = $("nameInput"); add(inp.value); inp.value = ""; inp.focus();
});
$("shareBtn").onclick = share;
$("randomBtn").onclick = randomize;
$("resetBtn").onclick = () => { players.forEach(p => p.team = "pool"); commit(); };
$("clearBtn").onclick = () => { $("confirmBox").hidden = false; $("clearBtn").hidden = true; };
$("confirmNo").onclick = () => { $("confirmBox").hidden = true; $("clearBtn").hidden = false; };
$("confirmYes").onclick = () => { $("confirmBox").hidden = true; $("clearBtn").hidden = false; players = []; commit(); };

document.querySelectorAll("[data-team]").forEach(zone => {
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("drop-over"); });
  zone.addEventListener("dragleave", e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove("drop-over"); });
  zone.addEventListener("drop", e => {
    e.preventDefault(); zone.classList.remove("drop-over");
    const id = e.dataTransfer.getData("text/plain"); if (id) move(id, zone.dataset.team);
  });
});
window.addEventListener("hashchange", () => { load(); render(); });

load();
render();
</script>
</body>
</html>
